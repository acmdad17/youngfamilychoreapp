<style>
:root {
  --bg:#0a0d12; --surface:#111620; --surface2:#181f2a; --surface3:#1f2938;
  --border:#232d3d; --border-strong:#2e3d54;
  --brooke:#ff7eb3; --audrey:#ffd166; --christian:#06d6a0;
  --mitchum:#4fc3f7; --bradford:#ff8c42;
  --primary:#10b981; --accent:#f59e0b;
  --text:#edf1f7; --muted:#8899b0; --faint:#3d4f66;
  --danger:#f87171; --success:#34d399;
  --font-display:'Sora',sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.3,1);
  --r:10px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  height:100vh;
  overflow:hidden;
  display:grid;
  grid-template-rows:auto 1fr auto;
}

/* ── HEADER ── */
#tv-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 32px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  gap:24px;
}
.tv-logo {
  font-family:var(--font-display);
  font-size:1.3rem;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:10px;
  letter-spacing:-.01em;
}
.logo-mark {
  width:10px; height:26px; border-radius:3px; flex-shrink:0;
  background:linear-gradient(to bottom,
    var(--brooke) 0 20%, var(--audrey) 20% 40%, var(--christian) 40% 60%,
    var(--mitchum) 60% 80%, var(--bradford) 80% 100%);
}
.logo-text b { color:var(--primary); }

#tv-clock {
  font-family:var(--font-display);
  font-size:2.6rem;
  font-weight:800;
  letter-spacing:.05em;
  line-height:1;
  color:var(--text);
}
#tv-date {
  font-size:.85rem;
  font-weight:600;
  color:var(--muted);
  text-align:right;
  line-height:1.4;
}

/* ── WEATHER ── */
#tv-weather {
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:8px 16px;
}
.w-icon { font-size:2rem; line-height:1; }
.w-temp { font-family:var(--font-display); font-size:1.4rem; font-weight:800; }
.w-desc { font-size:.72rem; color:var(--muted); font-weight:600; }
.w-loc  { font-size:.68rem; color:var(--faint); }

/* ── PRESENCE BAR ── */
#tv-presence {
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 32px 0;
  flex-wrap:wrap;
  min-height:0;
}
.pchip {
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px 14px 4px 10px;
  border-radius:999px;
  font-size:.78rem;
  font-weight:700;
  border:1px solid var(--border);
  background:var(--surface2);
  transition:all .3s;
}
.pchip.home  { border-color:#4ade8088; background:#4ade8011; color:#4ade80; }
.pchip.away  { color:var(--muted); }
.pdot { width:7px; height:7px; border-radius:50%; background:currentColor; flex-shrink:0; }

/* ── MAIN GRID ── */
#tv-main {
  display:grid;
  grid-template-columns:2fr 2fr 1.4fr;
  gap:0;
  overflow:hidden;
  min-height:0;
}

.tv-col {
  display:flex;
  flex-direction:column;
  gap:0;
  overflow:hidden;
  border-right:1px solid var(--border);
  padding:20px 24px;
  gap:16px;
}
.tv-col:last-child { border-right:none; }

.col-title {
  font-family:var(--font-display);
  font-size:.68rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:var(--muted);
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

/* ── EVENTS ── */
#events-list {
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow-y:auto;
  flex:1;
  min-height:0;
}
#events-list::-webkit-scrollbar { display:none; }

.ev-item {
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 12px;
  border-radius:var(--r);
  background:var(--surface2);
  border:1px solid var(--border);
  border-left:3px solid var(--accent);
}
.ev-time {
  font-size:.72rem;
  font-weight:700;
  color:var(--muted);
  white-space:nowrap;
  padding-top:1px;
  min-width:42px;
}
.ev-body { flex:1; min-width:0; }
.ev-title {
  font-weight:700;
  font-size:.88rem;
  line-height:1.3;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ev-who {
  font-size:.7rem;
  font-weight:600;
  margin-top:2px;
}
.empty-msg {
  color:var(--faint);
  font-size:.82rem;
  font-weight:600;
  padding:12px 0;
  text-align:center;
}

/* ── CHORES ── */
#chores-list {
  display:flex;
  flex-direction:column;
  gap:6px;
  overflow-y:auto;
  flex:1;
  min-height:0;
}
#chores-list::-webkit-scrollbar { display:none; }

.chore-row {
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  border-radius:var(--r);
  background:var(--surface2);
  border:1px solid var(--border);
  transition:opacity .2s;
}
.chore-row.done { opacity:.45; }
.chore-check {
  width:18px; height:18px; border-radius:50%;
  border:2px solid var(--border-strong);
  flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.chore-row.done .chore-check {
  background:var(--success);
  border-color:var(--success);
  color:#000;
  font-size:.7rem;
}
.chore-body { flex:1; min-width:0; }
.chore-name {
  font-weight:700;
  font-size:.85rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.chore-who {
  font-size:.68rem;
  color:var(--muted);
  font-weight:600;
  margin-top:1px;
}
.chore-pts {
  font-size:.7rem;
  font-weight:700;
  color:var(--accent);
  flex-shrink:0;
}

/* ── RIGHT COLUMN ── */
#presence-section, #countdown-section, #announcements-section, #meals-section {
  display:flex;
  flex-direction:column;
  gap:8px;
  flex-shrink:0;
}

/* ── MEMBERS ── */
.member-row {
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  border-radius:var(--r);
  background:var(--surface2);
  border:1px solid var(--border);
}
.member-avatar {
  width:32px; height:32px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:1rem;
  flex-shrink:0;
}
.member-name { font-weight:700; font-size:.85rem; flex:1; }
.member-status {
  font-size:.68rem;
  font-weight:700;
  padding:2px 8px;
  border-radius:999px;
}
.s-home { background:#4ade8018; color:#4ade80; }
.s-away { background:var(--surface3); color:var(--muted); }
.s-work { background:#60a5fa18; color:#60a5fa; }
.member-pts {
  font-size:.68rem;
  font-weight:700;
  color:var(--accent);
  margin-left:4px;
}

/* ── COUNTDOWNS ── */
.cd-item {
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  border-radius:var(--r);
  background:var(--surface2);
  border:1px solid var(--border);
}
.cd-icon { font-size:1.2rem; flex-shrink:0; }
.cd-body { flex:1; min-width:0; }
.cd-label {
  font-weight:700;
  font-size:.8rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cd-days {
  font-family:var(--font-display);
  font-size:.72rem;
  font-weight:700;
  color:var(--primary);
}

/* ── ANNOUNCEMENTS ── */
#tv-footer {
  border-top:1px solid var(--border);
  background:var(--surface);
  padding:8px 32px;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:44px;
  overflow:hidden;
}
.annc-label {
  font-size:.68rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--accent);
  white-space:nowrap;
}
#annc-ticker {
  flex:1;
  overflow:hidden;
  position:relative;
  height:22px;
}
#annc-inner {
  position:absolute;
  white-space:nowrap;
  font-size:.78rem;
  font-weight:600;
  color:var(--muted);
  animation:ticker 30s linear infinite;
}
@keyframes ticker { 0% { transform:translateX(100%); } 100% { transform:translateX(-100%); } }

/* ── ALERT OVERLAY ── */
#alert-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(16px);
  display:flex; align-items:center; justify-content:center;
  z-index:1000;
  opacity:0; pointer-events:none;
  transition:opacity .3s;
}
#alert-overlay.open { opacity:1; pointer-events:all; }
.alert-card {
  background:var(--surface);
  border:2px solid var(--primary);
  border-radius:16px;
  padding:60px 80px;
  max-width:600px;
  width:90vw;
  text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:20px;
  box-shadow:0 24px 64px rgba(0,0,0,.6);
  transform:scale(.88);
  transition:transform .35s var(--ease);
}
#alert-overlay.open .alert-card { transform:scale(1); }
.a-icon { font-size:5rem; line-height:1; }
.a-title { font-family:var(--font-display); font-size:2.4rem; font-weight:800; line-height:1.1; }
.a-body  { font-size:1.1rem; color:var(--muted); font-weight:600; }
.a-who   { font-size:1rem; font-weight:700; color:var(--primary); display:none; }
.alert-btn {
  background:var(--primary); color:#000;
  border:none; border-radius:10px;
  padding:14px 32px;
  font-family:var(--font-display); font-size:1rem; font-weight:800;
  cursor:pointer; transition:opacity .2s;
  min-width:180px;
}
.alert-btn:hover { opacity:.85; }
.alert-btn.dismiss {
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--border);
}

/* ── SCROLLBAR GLOBAL ── */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:4px; }

/* ── RIGHT COL SCROLL ── */
.tv-col.right-col {
  overflow-y:auto;
  gap:20px;
}
.tv-col.right-col::-webkit-scrollbar { display:none; }

/* ── MEAL ── */
.meal-row {
  display:flex; align-items:center; gap:8px;
  padding:7px 12px;
  border-radius:var(--r);
  background:var(--surface2); border:1px solid var(--border);
}
.meal-label { font-weight:700; font-size:.82rem; flex:1; }
.meal-who { font-size:.68rem; color:var(--muted); font-weight:600; }

/* ── LIVE DOT ── */
.live-dot {
  width:6px; height:6px; border-radius:50%;
  background:var(--primary);
  flex-shrink:0;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
</style>
</head>

<script>
// ── DATA ──
const MEMBERS = [
  {key:'Bradford', role:'Bomb Squad / Dad',   cls:'bradford', emoji:'👨', color:'#ff8c42'},
  {key:'Brooke',   role:'Creative Academy',   cls:'brooke',   emoji:'👩', color:'#ff7eb3'},
  {key:'Audrey',   role:'Hendrix College',     cls:'audrey',   emoji:'👧', color:'#ffd166'},
  {key:'Christian',role:'Work & School',       cls:'christian',emoji:'👦', color:'#06d6a0'},
  {key:'Mitchum',  role:'Band & School',       cls:'mitchum',  emoji:'🎺', color:'#4fc3f7'},
];
const PRESENCE_MEMBERS = [
  {key:'Bradford',emoji:'👨'},{key:'Brooke',emoji:'👩'},
  {key:'Christian',emoji:'👦'},{key:'Audrey',emoji:'👧'},{key:'Mitchum',emoji:'🎺'},
];

let events={}, chores={}, choreLog={}, countdowns={}, presence={}, familyAlerts={};
let meals={}, announcements={}, points={}, haTriggersData={};
let currentAlertId=null;

function fmtDate(d){return d.toLocaleDateString('en-CA');}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
const today=new Date();
const todayStr=fmtDate(today);
const todayDow=today.getDay();

function eventOccursOn(evt,dateStr){
  if(!evt.recurring||evt.recurring==='none') return evt.date===dateStr;
  if(dateStr<evt.date) return false;
  if(evt.recurringEnd&&dateStr>evt.recurringEnd) return false;
  const base=new Date(evt.date+'T12:00:00');
  const tgt=new Date(dateStr+'T12:00:00');
  const diff=Math.round((tgt-base)/(86400000));
  if(evt.recurring==='daily') return true;
  if(evt.recurring==='weekly') return diff%7===0;
  if(evt.recurring==='biweekly') return diff%14===0;
  if(evt.recurring==='monthly'){
    const bd=new Date(evt.date+'T12:00:00');
    const td=new Date(dateStr+'T12:00:00');
    return bd.getDate()===td.getDate();
  }
  return false;
}

// ── CLOCK ──
function updateClock(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  const s=String(now.getSeconds()).padStart(2,'0');
  document.getElementById('tv-clock').textContent=`${h}:${m}`;
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('tv-date').innerHTML=`${days[now.getDay()]}<br>${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
}
setInterval(updateClock,1000);
updateClock();

// ── WEATHER ──
function wmoIcon(c){if(c===0)return'☀️';if(c<=2)return'⛅';if(c<=3)return'☁️';if(c<=49)return'🌫️';if(c<=59)return'🌦️';if(c<=69)return'🌧️';if(c<=79)return'🌨️';if(c<=82)return'🌧️';if(c<=99)return'⛈️';return'🌤️';}
function wmoDesc(c){if(c===0)return'Clear';if(c<=2)return'Partly Cloudy';if(c<=3)return'Overcast';if(c<=49)return'Foggy';if(c<=59)return'Drizzle';if(c<=69)return'Rainy';if(c<=79)return'Snowy';if(c<=82)return'Showers';if(c<=99)return'Thunderstorm';return'Variable';}

async function fetchWeather(){
  try{
    const d=await(await fetch('https://api.open-meteo.com/v1/forecast?latitude=36.3348&longitude=-92.3849&current_weather=true&temperature_unit=fahrenheit')).json();
    const cw=d.current_weather;
    document.querySelector('.w-icon').textContent=wmoIcon(cw.weathercode);
    document.getElementById('w-temp').textContent=Math.round(cw.temperature)+'°F';
    document.getElementById('w-desc').textContent=wmoDesc(cw.weathercode);
  }catch(e){document.getElementById('w-desc').textContent='Unavailable';}
}
fetchWeather();
setInterval(fetchWeather, 30*60*1000);

// ── PRESENCE STRIP ──
function renderPresence(){
  const strip=document.getElementById('tv-presence');
  strip.innerHTML='';
  PRESENCE_MEMBERS.forEach(({key,emoji})=>{
    const p=presence[key];
    if(!p) return;
    const isHome=p.state==='home';
    const chip=document.createElement('div');
    chip.className='pchip '+(isHome?'home':'away');
    chip.innerHTML=`<span class="pdot"></span>${emoji} ${key}`;
    strip.appendChild(chip);
  });
}

// ── EVENTS ──
function fmtTime(t){
  if(!t) return '';
  const[h,m]=t.split(':').map(Number);
  const ampm=h>=12?'PM':'AM';
  const h12=h%12||12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

function renderEvents(){
  const list=document.getElementById('events-list');
  const evArr=Object.values(events).filter(e=>eventOccursOn(e,todayStr))
    .sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  if(!evArr.length){list.innerHTML='<div class="empty-msg">No events today — enjoy! 🎉</div>';return;}
  const memberColors=Object.fromEntries(MEMBERS.map(m=>[m.key,m.color]));
  list.innerHTML=evArr.map(e=>{
    const col=memberColors[e.person]||'#f59e0b';
    const typeEmoji={work:'💼',travel:'✈️',away:'🚗',personal:'⭐',school:'📚'}[e.type]||'📅';
    return `<div class="ev-item" style="border-left-color:${col}">
      <div class="ev-time">${e.time?fmtTime(e.time):'All day'}</div>
      <div class="ev-body">
        <div class="ev-title">${typeEmoji} ${e.title}</div>
        <div class="ev-who" style="color:${col}">${e.person}</div>
      </div>
    </div>`;
  }).join('');
}

// ── CHORES ──
function renderChores(){
  const list=document.getElementById('chores-list');
  const memberColors=Object.fromEntries(MEMBERS.map(m=>[m.key,m.color]));
  const arr=Object.entries(chores)
    .filter(([,c])=>!c.scheduleDays||!c.scheduleDays.length||c.scheduleDays.includes(todayDow))
    .sort(([,a],[,b])=>(a.name||'').localeCompare(b.name||''));

  if(!arr.length){list.innerHTML='<div class="empty-msg">No chores today 🎉</div>';return;}

  list.innerHTML=arr.map(([id,chore])=>{
    const todayLog=choreLog[todayStr]?.[id]||{};
    const done=Object.values(todayLog).length>0;
    const doers=[...new Set(Object.values(todayLog).map(e=>e.person))];
    const assigned=chore.assignedTo||[];
    const whoStr=done?`Done by ${doers.join(', ')}`:assigned.length?`→ ${assigned.join(', ')}`:'Open';
    const whoColor=done?'#34d399':(assigned[0]?memberColors[assigned[0]]||'#8899b0':'#8899b0');
    return `<div class="chore-row${done?' done':''}">
      <div class="chore-check">${done?'✓':''}</div>
      <div class="chore-body">
        <div class="chore-name">${chore.name||'Chore'}</div>
        <div class="chore-who" style="color:${whoColor}">${whoStr}</div>
      </div>
      <div class="chore-pts">+${chore.points||1}⭐</div>
    </div>`;
  }).join('');
}

// ── MEMBERS ──
function renderMembers(){
  const list=document.getElementById('members-list');
  list.innerHTML=MEMBERS.map(m=>{
    const p=presence[m.key];
    const isPhysAway=p?.state==='not_home';
    const memberEvents=Object.values(events).filter(e=>eventOccursOn(e,todayStr)&&e.person===m.key);
    const isWork=memberEvents.some(e=>e.type==='work');
    const isAway=memberEvents.some(e=>e.type==='travel'||e.type==='away');
    const statusLabel=isAway?'✈️ Away':isWork?'💼 Work':isPhysAway?'🚗 Away':'🏠 Home';
    const statusCls=isAway||isPhysAway?'s-away':isWork?'s-work':'s-home';
    const pts=points[m.key]?.total||0;
    return `<div class="member-row" style="border-left:3px solid ${m.color}22">
      <div class="member-avatar" style="background:${m.color}18;border:2px solid ${m.color}">${m.emoji}</div>
      <div class="member-name">${m.key}</div>
      ${pts>0?`<div class="member-pts">${pts}⭐</div>`:''}
      <div class="member-status ${statusCls}">${statusLabel}</div>
    </div>`;
  }).join('');
}

// ── MEALS ──
function renderMeals(){
  const dinner=meals[todayStr]?.dinner;
  const section=document.getElementById('dinner-section');
  const list=document.getElementById('meals-list');
  if(!dinner){section.style.display='none';return;}
  section.style.display='block';
  list.innerHTML=`<div class="meal-row"><span class="meal-label">🍴 ${dinner}</span></div>`;
}

// ── COUNTDOWNS ──
function renderCountdowns(){
  const arr=Object.values(countdowns)
    .map(c=>{
      const target=new Date(c.targetDate+'T'+(c.targetTime||'00:00:00'));
      const diff=Math.ceil((target-Date.now())/(86400000));
      return{...c,diff};
    })
    .filter(c=>c.diff>=0)
    .sort((a,b)=>a.diff-b.diff)
    .slice(0,5);

  const section=document.getElementById('countdown-section');
  const list=document.getElementById('countdown-list');
  if(!arr.length){section.style.display='none';return;}
  section.style.display='block';
  list.innerHTML=arr.map(c=>`<div class="cd-item">
    <div class="cd-icon">${c.icon||'⏳'}</div>
    <div class="cd-body">
      <div class="cd-label">${c.label}</div>
      <div class="cd-days">${c.diff===0?'Today!':c.diff===1?'Tomorrow':c.diff+' days'}</div>
    </div>
  </div>`).join('');
}

// ── ANNOUNCEMENTS TICKER ──
function renderAnnouncements(){
  const inner=document.getElementById('annc-inner');
  const arr=Object.values(announcements).sort((a,b)=>b.created-a.created);
  if(!arr.length){inner.textContent='Young Family Dashboard — Live';return;}
  inner.textContent=arr.map(a=>`${a.emoji||'📢'} ${a.text}`).join('    •    ');
}

// ── FAMILY ALERTS ──
const ALERT_TTL=10*60*1000;
let lastAlertSeen=null;

function handleAlerts(){
  const active=Object.entries(familyAlerts)
    .sort(([,a],[,b])=>b.triggeredAt-a.triggeredAt)
    .find(([,a])=>a.active&&(Date.now()-a.triggeredAt)<ALERT_TTL);

  if(active){
    const[id,alert]=active;
    if(id!==lastAlertSeen){
      lastAlertSeen=id;
      showAlert(id,alert);
    }
  } else {
    // Check if current alert was claimed/dismissed
    if(currentAlertId){
      const a=familyAlerts[currentAlertId];
      if(a&&(!a.active||a.claimedBy)){
        if(a.claimedBy){
          document.getElementById('a-body').textContent='';
          document.getElementById('a-who').style.display='block';
          document.getElementById('a-who').textContent=`✅ ${a.claimedBy} is on it!`;
          setTimeout(dismissAlert, 2500);
        } else {
          dismissAlert();
        }
      }
    }
  }
}

function showAlert(id,alert){
  currentAlertId=id;
  document.getElementById('a-icon').textContent=alert.emoji||'🔔';
  document.getElementById('a-title').textContent=alert.label;
  document.getElementById('a-body').textContent=`${alert.triggeredBy} needs a hand`;
  document.getElementById('a-card')||document.getElementById('alert-card').style.borderColor=alert.color||'#10b981';
  document.getElementById('alert-card').style.borderColor=alert.color||'#10b981';
  document.getElementById('a-who').style.display='none';
  document.getElementById('a-who').textContent='';
  document.getElementById('a-claim').style.display='';
  document.getElementById('alert-overlay').classList.add('open');
}

function dismissAlert(){
  currentAlertId=null;
  document.getElementById('alert-overlay').classList.remove('open');
}

async function claimAlert(){
  if(!currentAlertId) return;
  const {ref,db}=window._tvdb;
  try{
    const {update}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
    await update(ref(db,`familyAlerts/${currentAlertId}`),{claimedBy:'TV Display',active:false});
  }catch(e){console.warn('Claim failed',e);}
  document.getElementById('a-claim').style.display='none';
  document.getElementById('a-who').style.display='block';
  document.getElementById('a-who').textContent='✅ Got it!';
  setTimeout(dismissAlert,2000);
}

// ── HA TRIGGERS → PRESENCE ──
function processHaTriggers(){
  const now=Date.now();
  const ONE_HOUR=3600000;
  const TEN_MIN=600000;
  Object.entries(haTriggersData).forEach(([id,t])=>{
    if((now-(t.triggeredAt||0))>ONE_HOUR) return;
    if(t._processed||t.active===false) return;
    if((now-(t.triggeredAt||0))>TEN_MIN) return;
    if(t.type==='presence'&&t.label){
      presence[t.label]={state:t.emoji||'not_home',updatedAt:t.triggeredAt||now};
      renderPresence();
      renderMembers();
    }
  });
}

// ── RENDER ALL ──
function renderAll(){
  renderPresence();
  renderEvents();
  renderChores();
  renderMembers();
  renderMeals();
  renderCountdowns();
  renderAnnouncements();
}

// ── FIREBASE SUBSCRIBE ──
document.addEventListener('fb-ready', () => {
  const {ref,onValue,db}=window._tvdb;
  const noop=()=>{};
  onValue(ref(db,'events'),       s=>{events=s.val()||{};renderEvents();renderMembers();},noop);
  onValue(ref(db,'chores'),       s=>{chores=s.val()||{};renderChores();},noop);
  onValue(ref(db,'choreLog'),     s=>{choreLog=s.val()||{};renderChores();},noop);
  onValue(ref(db,'countdowns'),   s=>{countdowns=s.val()||{};renderCountdowns();},noop);
  onValue(ref(db,'presence'),     s=>{presence=s.val()||{};renderPresence();renderMembers();},noop);
  onValue(ref(db,'familyAlerts'), s=>{familyAlerts=s.val()||{};handleAlerts();},noop);
  onValue(ref(db,'announcements'),s=>{announcements=s.val()||{};renderAnnouncements();},noop);
  onValue(ref(db,'meals'),        s=>{meals=s.val()||{};renderMeals();},noop);
  onValue(ref(db,'points'),       s=>{points=s.val()||{};renderMembers();},noop);
  onValue(ref(db,'ha_triggers'),  s=>{haTriggersData=s.val()||{};processHaTriggers();},noop);
});
</script>
