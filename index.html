<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Young Family Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 12px;
      color: #06d6a0;
      font-weight: 700;
      text-align: center;
    }
    p {
      font-size: 1.3rem;
      margin: 0 0 40px 0;
      max-width: 400px;
      text-align: center;
      line-height: 1.6;
      color: #555;
    }
    small {
      color: #999;
      font-size: 0.85rem;
      margin-top: auto;
    }
    /* Added a card container for better focus */
    .card {
      background: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      max-width: 480px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to Young Family Dashboard</h1>
    <p>Manage your family’s chores, schedule, and more all in one place.</p>
  </div>
  <small>&copy; 2024 Young Family Dashboard</small>
</body>
</html>
