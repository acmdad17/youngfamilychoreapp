<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My App</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      color: #222;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 2.75rem;
      margin-bottom: 12px;
      color: #0057b7;
    }
    p {
      font-size: 1.25rem;
      margin-bottom: 32px;
      max-width: 360px;
      text-align: center;
      line-height: 1.5;
      color: #444;
    }
    small {
      color: #999;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Welcome to My App</h1>
  <p>This is a simple app designed to help you get started quickly and efficiently.</p>
  <small>&copy; 2024 My App</small>

</html>
